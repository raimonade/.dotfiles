<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline — skeleton</title>
<!--
  Skeleton: Mermaid diagram with zoom / pan / fit / expand.
  REQUIRES NETWORK: Mermaid loads from a CDN. Use this template only when the
  user has allowed network access for the artifact; the <noscript>-style
  fallback below stays visible if the module never loads.
  Teal palette so consecutive artifacts don't all look alike.
-->
<style>
  :root {
    --font-body: 'Avenir Next', Optima, 'Segoe UI', system-ui, sans-serif;
    --font-mono: Menlo, 'SF Mono', Consolas, monospace;
    --bg: #f0fdfa; --surface: #fff; --surface-2: #e3f5f1;
    --border: rgba(0,0,0,.08); --text: #134e4a; --text-dim: #5f8a85;
    --accent-a: #0d9488; --accent-a-dim: rgba(13,148,136,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #042f2e; --surface: #0a3d3a; --surface-2: #073634;
      --border: rgba(255,255,255,.09); --text: #ccfbf1; --text-dim: #5eead4;
      --accent-a: #2dd4bf; --accent-a-dim: rgba(45,212,191,.14);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg) radial-gradient(circle, var(--border) 1px, transparent 1px) 0 0 / 24px 24px;
    color: var(--text); font: 400 15px/1.65 var(--font-body); padding: 40px 24px;
  }
  :where(h1, p, li) { overflow-wrap: break-word; }
  .page { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 36px; line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
  .subtitle { font: 12px var(--font-mono); color: var(--text-dim); margin: 6px 0 24px; }
  a { color: var(--accent-a); }
  code { font: 12px var(--font-mono); background: var(--accent-a-dim); color: var(--accent-a); padding: 1px 5px; border-radius: 3px; }

  .diagram-shell { position: relative; }
  .diagram-shell__hint { font: 11px var(--font-mono); color: var(--text-dim); margin-bottom: 8px; }
  .mermaid-wrap { position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; min-height: 400px; cursor: grab; }
  .mermaid-wrap.is-panning { cursor: grabbing; user-select: none; }
  .mermaid-viewport { position: relative; overflow: hidden; width: 100%; height: 100%;
    min-height: 300px; touch-action: pan-y; }
  .mermaid-canvas { position: absolute; top: 0; left: 0; }

  .zoom-controls { position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; gap: 2px;
    align-items: center; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px; }
  .zoom-controls button { width: 28px; height: 28px; border: none; background: none; cursor: pointer;
    border-radius: 4px; color: var(--text-dim); font: 14px var(--font-mono); }
  .zoom-controls button:hover { background: var(--border); color: var(--text); }
  .zoom-label { font: 10px var(--font-mono); color: var(--text-dim); padding: 0 6px; white-space: nowrap; }

  .mermaid .nodeLabel { font-family: var(--font-body) !important; font-size: 17px !important; }
  .mermaid .edgeLabel { font-family: var(--font-mono) !important; font-size: 13px !important; }

  .fallback { margin-top: 16px; background: var(--surface-2); border: 1px solid var(--border);
    border-left: 3px solid var(--accent-a); border-radius: 0 10px 10px 0; padding: 14px 18px;
    font-size: 14px; color: var(--text-dim); }

  @media (max-width: 700px) { body { padding: 20px 14px; } h1 { font-size: 26px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="page">
  <h1>Diagram title</h1>
  <p class="subtitle">one line of factual scope</p>

  <section class="diagram-shell">
    <p class="diagram-shell__hint">Ctrl/Cmd + wheel to zoom · drag to pan · double-click to fit</p>
    <div class="mermaid-wrap">
      <div class="zoom-controls">
        <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" data-action="zoom-out" aria-label="Zoom out">&minus;</button>
        <button type="button" data-action="zoom-fit" aria-label="Fit diagram">&#8634;</button>
        <button type="button" data-action="zoom-expand" aria-label="Open full size">&#x26F6;</button>
        <span class="zoom-label">Loading…</span>
      </div>
      <div class="mermaid-viewport"><div class="mermaid mermaid-canvas"></div></div>
    </div>
    <script type="text/plain" class="diagram-source">
      flowchart TD
        A["Push to main"] --> B{"Tests pass?"}
        B -->|"yes"| C["Build image"]
        B -->|"no"| D["Alert + stop"]
        C --> E["Deploy staging"]
        E --> F["Manual approval"]
        F --> G["Deploy production"]
    </script>
  </section>

  <p class="fallback">
    Text fallback, kept in the page so it still reads without network:
    push &rarr; tests &rarr; build &rarr; staging &rarr; approval &rarr; production;
    a failing test stops the run and alerts.
  </p>
</div>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  const cfg = { pad: 28, minH: 360, maxH: 960, maxHVh: .84, maxFit: 1.8, min: .08, max: 6.5, step: .14 };
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;

  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      fontFamily: "'Avenir Next', Optima, system-ui, sans-serif",
      fontSize: '17px',
      primaryColor: dark ? '#115e59' : '#ccfbf1',
      primaryBorderColor: dark ? '#2dd4bf' : '#0d9488',
      primaryTextColor: dark ? '#ccfbf1' : '#134e4a',
      lineColor: dark ? '#5eead4' : '#5f8a85',
    },
  });

  function initDiagram(shell) {
    const wrap = shell.querySelector('.mermaid-wrap');
    const viewport = shell.querySelector('.mermaid-viewport');
    const canvas = shell.querySelector('.mermaid-canvas');
    const source = shell.querySelector('.diagram-source');
    const label = shell.querySelector('.zoom-label');
    if (!wrap || !viewport || !canvas || !source || !label) return;

    let zoom = 1, panX = 0, panY = 0, svgW = 0, svgH = 0;

    const canPan = () => svgW * zoom + cfg.pad * 2 > viewport.clientWidth
      || svgH * zoom + cfg.pad * 2 > viewport.clientHeight;

    function apply() {
      const svg = canvas.querySelector('svg');
      if (!svg || !svgW) return;
      const rW = svgW * zoom, rH = svgH * zoom;
      panX = rW + cfg.pad * 2 <= viewport.clientWidth
        ? (viewport.clientWidth - rW) / 2
        : clamp(panX, viewport.clientWidth - rW - cfg.pad, cfg.pad);
      panY = rH + cfg.pad * 2 <= viewport.clientHeight
        ? (viewport.clientHeight - rH) / 2
        : clamp(panY, viewport.clientHeight - rH - cfg.pad, cfg.pad);
      svg.style.width = rW + 'px';
      svg.style.height = rH + 'px';
      canvas.style.transform = `translate(${panX}px, ${panY}px)`;
      label.textContent = Math.round(zoom * 100) + '%';
    }

    function fit() {
      if (!svgW) return;
      const aW = Math.max(80, viewport.clientWidth - cfg.pad * 2);
      const aH = Math.max(80, viewport.clientHeight - cfg.pad * 2);
      zoom = clamp(Math.min(aW / svgW, aH / svgH), cfg.min, cfg.maxFit);
      panX = (viewport.clientWidth - svgW * zoom) / 2;
      panY = (viewport.clientHeight - svgH * zoom) / 2;
      apply();
    }

    function zoomAround(factor, cx, cy) {
      const next = clamp(zoom * factor, cfg.min, cfg.max);
      const ratio = next / zoom;
      panX = cx - ratio * (cx - panX);
      panY = cy - ratio * (cy - panY);
      zoom = next;
      apply();
    }

    function naturalSize(svg) {
      let w = svg.viewBox?.baseVal?.width || 0;
      let h = svg.viewBox?.baseVal?.height || 0;
      if (!w) { w = parseFloat(svg.getAttribute('width')) || 0; h = parseFloat(svg.getAttribute('height')) || 0; }
      if (!w) { const b = svg.getBBox(); w = b.width; h = b.height; }
      if (!w) { const r = svg.getBoundingClientRect(); w = r.width || 1000; h = r.height || 700; }
      if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      return { w, h };
    }

    function setHeight() {
      if (!svgW) return;
      const usable = Math.max(280, wrap.getBoundingClientRect().width - 2);
      const ideal = (svgH / svgW) * usable + cfg.pad * 2;
      const hardMax = Math.min(cfg.maxH, Math.max(cfg.minH + 40, Math.floor(innerHeight * cfg.maxHVh)));
      wrap.style.height = Math.round(clamp(ideal, cfg.minH, hardMax)) + 'px';
    }

    function expand() {
      const svg = canvas.querySelector('svg');
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.style.width = clone.style.height = '';
      const bg = dark ? '#042f2e' : '#f0fdfa';
      const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">`
        + `<title>Diagram</title><style>body{margin:0;min-height:100vh;display:flex;`
        + `align-items:center;justify-content:center;background:${bg};padding:40px;`
        + `box-sizing:border-box}svg{max-width:100%;max-height:90vh;height:auto}</style>`
        + `</head><body>${clone.outerHTML}</body></html>`;
      open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
    }

    const actions = {
      'zoom-in': () => zoomAround(1 + cfg.step, viewport.clientWidth / 2, viewport.clientHeight / 2),
      'zoom-out': () => zoomAround(1 / (1 + cfg.step), viewport.clientWidth / 2, viewport.clientHeight / 2),
      'zoom-fit': fit,
      'zoom-expand': expand,
    };
    for (const [action, handler] of Object.entries(actions)) {
      wrap.querySelector(`[data-action="${action}"]`)?.addEventListener('click', handler);
    }

    viewport.addEventListener('dblclick', fit);

    viewport.addEventListener('wheel', (e) => {
      const rect = viewport.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        zoomAround(e.deltaY < 0 ? 1 + cfg.step : 1 / (1 + cfg.step), e.clientX - rect.left, e.clientY - rect.top);
      } else if (canPan()) {
        e.preventDefault();
        panX -= e.deltaX;
        panY -= e.deltaY;
        apply();
      }
    }, { passive: false });

    let drag = null;
    viewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.zoom-controls') || !canPan()) return;
      drag = { x: e.clientX, y: e.clientY, px: panX, py: panY };
      viewport.setPointerCapture(e.pointerId);
      wrap.classList.add('is-panning');
    });
    viewport.addEventListener('pointermove', (e) => {
      if (!drag) return;
      panX = drag.px + (e.clientX - drag.x);
      panY = drag.py + (e.clientY - drag.y);
      apply();
    });
    for (const type of ['pointerup', 'pointercancel']) {
      viewport.addEventListener(type, () => { drag = null; wrap.classList.remove('is-panning'); });
    }

    new ResizeObserver(() => { if (svgW) { setHeight(); fit(); } }).observe(wrap);

    (async function render() {
      try {
        const code = source.textContent.trim();
        if (!code) { label.textContent = 'Empty source'; return; }
        const id = 'd' + Math.random().toString(36).slice(2, 8);
        const { svg } = await mermaid.render(id, code);
        // text/html parser: the strict SVG parser truncates Mermaid's foreignObject labels
        const parsed = new DOMParser().parseFromString(svg, 'text/html').body.querySelector('svg');
        if (!parsed) { label.textContent = 'No SVG'; return; }
        canvas.replaceChildren(document.adoptNode(parsed));
        const node = canvas.querySelector('svg');
        ({ w: svgW, h: svgH } = naturalSize(node));
        node.removeAttribute('width');
        node.removeAttribute('height');
        node.style.maxWidth = 'none';
        node.style.display = 'block';
        setHeight();
        fit();
      } catch (err) {
        console.error('Mermaid render failed:', err);
        label.textContent = 'Render failed';
      }
    })();
  }

  document.querySelectorAll('.diagram-shell').forEach(initDiagram);
</script>
</body>
</html>
