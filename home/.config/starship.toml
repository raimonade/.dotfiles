# Vite Plus node shims can occasionally take longer than Starship's default
# 500ms timeout to resolve. Give language-version commands a bit more room and
# avoid probing Node in repos that merely contain JS/TS files.
command_timeout = 2000

# Zenbones: a restrained path, branch/status, jobs, and prompt marker.
format = "$directory$git_branch$git_status$jobs$character"

[buf]
disabled = true

[character]
error_symbol = "[→](magenta)"
success_symbol = "[→](magenta)"

[directory]
format = "[$path]($style) "
style = "blue"
truncate_to_repo = false

[dotnet]
detect_files = ["global.json", "Directory.Build.props", "Directory.Build.targets", "Packages.props"]

[git_branch]
format = "[$branch]($style)"
style = "yellow"
symbol = ""
truncation_length = 18

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "yellow"

[jobs]
format = "[☆ $number ]($style)"
style = "magenta"

[git_commit]
# disabled = true

[git_state]
# disabled = true

[golang]
symbol = " "

[lua]
symbol = " "

[nix_shell]
symbol = " "

[nodejs]
# Only show Node for actual Node projects. This avoids unnecessary `node
# --version` calls in repos that just happen to contain JS/TS files.
detect_extensions = []
detect_files = ["package.json", ".node-version", ".nvmrc", ".tool-versions"]
detect_folders = ["node_modules"]
format = "[$symbol($version)]($style) "

[gcloud]
disabled = true

[package]
disabled = true

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "bold yellow"
